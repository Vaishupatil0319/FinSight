<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Financial Profile - FinSight</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            FinSight
        </a>

    </div>

</nav>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">
                    Financial Profile
                </h2>

                <p class="text-muted text-center">
                    Enter your basic financial information
                </p>


                <form method="POST">

                    <!-- Name -->

                    <div class="mb-3">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            placeholder="Enter your name"
                            required
                        >

                    </div>


                    <!-- Monthly Income -->

                    <div class="mb-3">

                        <label class="form-label">
                            Monthly Income (₹)
                        </label>

                        <input
                            type="number"
                            name="monthly_income"
                            class="form-control"
                            placeholder="Example: 50000"
                            min="0"
                            required
                        >

                    </div>


                    <!-- Existing Savings -->

                    <div class="mb-3">

                        <label class="form-label">
                            Existing Savings (₹)
                        </label>

                        <input
                            type="number"
                            name="existing_savings"
                            class="form-control"
                            placeholder="Example: 100000"
                            min="0"
                            value="0"
                            required
                        >

                    </div>


                    <!-- Risk Preference -->

                    <div class="mb-4">

                        <label class="form-label">
                            Risk Preference
                        </label>

                        <select
                            name="risk_preference"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Risk Preference
                            </option>

                            <option value="Low">
                                Low Risk
                            </option>

                            <option value="Medium">
                                Medium Risk
                            </option>

                            <option value="High">
                                High Risk
                            </option>

                        </select>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Save Profile & Continue
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>

</html>
