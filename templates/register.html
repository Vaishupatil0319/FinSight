
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FinSight - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 500px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h2 class="mb-2">Create Account</h2>
            <p class="text-muted">Join FinSight to manage your finances.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST">
                <label class="form-label">Full Name</label>
                <input class="form-control mb-3" name="name" required>

                <label class="form-label">Email</label>
                <input class="form-control mb-3" type="email" name="email" required>

                <label class="form-label">Password (minimum 8 characters)</label>
                <input class="form-control mb-3" type="password" name="password" minlength="8" required>

                <button class="btn btn-primary w-100" type="submit">Register</button>
            </form>

            <p class="mt-3 mb-0 text-center">
                Already registered?
                <a href="{{ url_for('login') }}">Login</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
